{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}裝置配對{% endblock %}
{% block content %}
<main class="container py-5 text-center" id="devicePairPage" style="max-width: 420px">
    <h1 class="h4 fw-bold mb-3"><i class="bi bi-display me-2 text-warning"></i>裝置配對</h1>
    {% if current %}<div class="alert alert-info small">此裝置目前註冊為「{{ current.name }}」；輸入新的配對碼可重新註冊。</div>{% endif %}
    <form method="POST" class="card rounded-4 p-4" id="devicePairForm">{{ csrf() }}
        <label class="form-label" for="pairCode">請輸入後台「裝置管理」顯示的 6 位數配對碼</label>
        <input class="form-control form-control-lg text-center fs-3 mb-3" id="pairCode" name="code" inputmode="numeric" maxlength="6" autocomplete="off" required>
        <button class="btn btn-warning btn-lg fw-bold" type="submit">配對</button>
    </form>
</main>
{% endblock %}
