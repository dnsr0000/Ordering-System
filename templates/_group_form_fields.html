{# 建立團購的欄位 (公開頁與後台代建共用)；需要 default_pickup #}
<div class="row g-2">
    <div class="col-12"><label class="form-label small" for="gTitle">{{ ui.gf_title }}</label>
        <input class="form-control" id="gTitle" name="title" maxlength="60" required placeholder="{{ ui.gf_title_ph }}"></div>
    <div class="col-6"><label class="form-label small" for="gName">{{ ui.gf_host_name }}</label>
        <input class="form-control" id="gName" name="organizer_name" maxlength="30" required></div>
    <div class="col-6"><label class="form-label small" for="gPhone">{{ ui.gf_host_phone }}</label>
        <input class="form-control" id="gPhone" name="organizer_phone" inputmode="tel" pattern="09\d{8}" required></div>
    <div class="col-6"><label class="form-label small" for="gPickup">{{ ui.pickup_time }}</label>
        <input class="form-control" id="gPickup" type="datetime-local" name="pickup_at" step="900" required value="{{ default_pickup.strftime('%Y-%m-%dT%H:%M') }}"></div>
    <div class="col-6"><label class="form-label small" for="gDeadline">{{ ui.gf_deadline_a }} {{ cfg.deadline_minutes }} {{ ui.gf_deadline_b }}</label>
        <input class="form-control" id="gDeadline" type="datetime-local" name="deadline" step="900"></div>
    <div class="col-6"><label class="form-label small" for="gType">{{ ui.gf_type }}</label>
        <select class="form-select" id="gType" name="order_type"><option value="外帶">{{ ui.takeout }}</option><option value="內用">{{ ui.dinein }}</option></select></div>
    <div class="col-6 d-flex align-items-end"><div class="form-check">
        <input class="form-check-input" type="checkbox" name="auto_submit" value="1" id="gAuto" checked>
        <label class="form-check-label small" for="gAuto">{{ ui.gf_auto_submit }}</label></div></div>
    <input type="hidden" name="auto_submit" value="0">
    <div class="col-12"><label class="form-label small" for="gNote">{{ ui.gf_note }}</label>
        <input class="form-control" id="gNote" name="note" maxlength="100" placeholder="{{ ui.gf_note_ph }}"></div>
</div>
