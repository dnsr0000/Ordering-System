{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}{{ ui.wl_title }}{{ ui.title_sep }}{{ tenant.name }}{% endblock %}
{% block content %}
<main class="container py-5" id="waitlist-join-page" style="max-width: 480px">
    <h1 class="h3 fw-bold text-center">{{ tenant.name }} {{ ui.wl_title }}</h1>
    <p class="text-center text-white-50">{{ ui.wl_waiting_a }} <strong class="text-warning" id="waitingCount">{{ waiting }}</strong> {{ ui.wl_waiting_b }}</p>
    <form method="POST" class="card rounded-4 p-4" id="waitlistJoinForm">{{ csrf() }}
        <label class="form-label fw-bold" for="wl-size">{{ ui.wl_party }}</label>
        <input class="form-control form-control-lg mb-3" id="wl-size" type="number" min="1" max="50" name="party_size" value="2" required>
        <label class="form-label" for="wl-name">{{ ui.wl_name }}</label>
        <input class="form-control mb-3" id="wl-name" name="name" maxlength="60">
        <label class="form-label" for="wl-phone">{{ ui.wl_phone }}</label>
        <input class="form-control mb-3" id="wl-phone" name="phone" inputmode="tel" maxlength="20">
        <button class="btn btn-warning btn-lg fw-bold text-dark" type="submit">{{ ui.wl_take }}</button>
    </form>
</main>
{% endblock %}
