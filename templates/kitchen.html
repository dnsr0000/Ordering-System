{% extends "base.html" %}

{% block title %}廚房出單即時看板 (KDS){% endblock %}

{% block head %}
{# 沒有網站圖示：避免瀏覽器請求 /favicon.ico 得到 404 (建議移到 base.html) #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/kitchen.css') }}">
{% endblock %}

{% block content %}
<header class="header-kds py-2 px-4 mb-3 sticky-top">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-fire text-danger fs-2"></i>
            <div>
                <h4 class="mb-0 fw-bold text-white">廚房出單即時看板 (KDS)</h4>
                <small class="text-white-50">待製作訂單：<span id="pendingCountBadge" class="badge bg-danger fs-6">0</span> 筆</small>
            </div>
        </div>

        <div class="d-flex align-items-center gap-3">
            <button type="button" id="completeAllBtn" class="btn btn-success btn-sm fw-bold shadow-sm" data-action="complete-all" disabled>
                <i class="bi bi-check-all fs-6 me-1"></i> 全部完成
            </button>
            <button type="button" id="soundToggleBtn" class="btn btn-outline-warning btn-sm fw-bold" data-action="toggle-sound">
                <i class="bi bi-volume-up-fill me-1"></i> 音效提示：<span id="soundStatusText">已開啟</span>
            </button>
            <div class="clock bg-dark px-3 py-1 rounded border border-secondary text-warning fw-bold" id="clock">00:00:00</div>
            <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-outline-light btn-sm fw-bold">
                <i class="bi bi-gear-fill"></i> 後台系統
            </a>
        </div>
    </div>
</header>

<main class="container-fluid px-4 pb-4">
    <div id="ordersGrid" class="row g-3" aria-live="polite"></div>

    <div id="noOrdersMessage" class="text-center py-5 d-none">
        <i class="bi bi-check2-circle text-success display-1"></i>
        <h3 class="text-white-50 mt-3">目前無待製作訂單，廚房備料中！</h3>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/kitchen.js') }}"></script>
{% endblock %}
