<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廚房出單即時看板 (KDS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: "Microsoft JhengHei", -apple-system, sans-serif;
            min-height: 100vh;
        }
        .header-kds {
            background: #151e32;
            border-bottom: 2px solid #334155;
        }
        .kds-card {
            background: #1e293b;
            border-radius: 16px;
            border: 3px solid #475569;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }
        .border-time-normal { border-color: #22c55e !important; }
        .border-time-warning { border-color: #eab308 !important; }
        .border-time-danger { 
            border-color: #ef4444 !important; 
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .item-row {
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .item-row:last-child {
            border-bottom: none;
        }
        .btn-complete {
            background-color: #22c55e;
            border: none;
            color: #000;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 10px 0;
            border-radius: 10px;
        }
        .btn-complete:hover {
            background-color: #16a34a;
            color: #fff;
        }
    </style>
</head>
<body>

    <header class="header-kds py-2 px-4 mb-3 sticky-top">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <i class="bi bi-fire text-danger fs-2"></i>
                <div>
                    <h4 class="mb-0 fw-bold text-white">廚房出單即時看板 (KDS)</h4>
                    <small class="text-white-50">待製作訂單：<span id="pendingCountBadge" class="badge bg-danger fs-6">0</span> 筆</small>
                </div>
            </div>

            <div class="d-flex align-items-center gap-3">
                <button id="completeAllBtn" class="btn btn-success btn-sm fw-bold shadow-sm" onclick="completeAllOrders()" disabled>
                    <i class="bi bi-check-all fs-6 me-1"></i> 全部完成
                </button>
                <button id="soundToggleBtn" class="btn btn-outline-warning btn-sm fw-bold" onclick="toggleAudio()">
                    <i class="bi bi-volume-up-fill me-1"></i> 音效提示：<span id="soundStatusText">已開啟</span>
                </button>
                <div class="bg-dark px-3 py-1.5 rounded border border-secondary text-warning fw-bold" style="font-family: monospace;" id="clock">
                    00:00:00
                </div>
                <a href="/admin" class="btn btn-outline-light btn-sm fw-bold">
                    <i class="bi bi-gear-fill"></i> 後台系統
                </a>
            </div>
        </div>
    </header>

    <div class="container-fluid px-4 pb-4">
        <div id="ordersGrid" class="row g-3">
            </div>

        <div id="noOrdersMessage" class="text-center py-5" style="display: none;">
            <i class="bi bi-check2-circle text-success display-1"></i>
            <h3 class="text-white-50 mt-3">目前無待製作訂單，廚房備料中！</h3>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
        let isAudioEnabled = true;
        let knownOrderIds = new Set();
        let isFirstLoad = true;
        let audioCtx = null;

        // 💡 取得或喚醒 AudioContext（突破瀏覽器 Autoplay 限制）
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 點擊頁面任何地方即自動解鎖瀏覽器音效權限
        document.addEventListener('click', function() {
            getAudioContext();
        }, { once: true });

        // 💡 Web Audio API 清脆雙音叮咚 (Ding-Dong) 提示音
        function playChime() {
            if (!isAudioEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const now = ctx.currentTime;

                // 第一聲：高音 (E5 - 659.25Hz)
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now);
                gain1.gain.setValueAtTime(0.4, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.35);

                // 第二聲：清脆主音 (G5 - 783.99Hz)
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(783.99, now + 0.18);
                gain2.gain.setValueAtTime(0.4, now + 0.18);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.18);
                osc2.stop(now + 0.7);
            } catch(e) {
                console.warn("音效播放失敗:", e);
            }
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            getAudioContext();
            document.getElementById('soundStatusText').innerText = isAudioEnabled ? '已開啟' : '已靜音';
            document.getElementById('soundToggleBtn').className = isAudioEnabled ? 'btn btn-outline-warning btn-sm fw-bold' : 'btn btn-outline-secondary btn-sm fw-bold';
            if (isAudioEnabled) {
                playChime(); // 切換開啟時試播一次
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        function fetchKitchenOrders() {
            fetch('/api/kitchen_orders')
                .then(res => res.json())
                .then(data => {
                    if (!data.success) return;
                    renderOrders(data.orders);
                })
                .catch(err => console.error("KDS 載入失敗:", err));
        }

        function renderOrders(orders) {
            const grid = document.getElementById('ordersGrid');
            const noMsg = document.getElementById('noOrdersMessage');
            const countBadge = document.getElementById('pendingCountBadge');
            
            countBadge.innerText = orders.length;
            if (completeAllBtn) {
                completeAllBtn.disabled = (orders.length === 0);
            }
            if (orders.length === 0) {
                grid.innerHTML = '';
                noMsg.style.display = 'block';
                knownOrderIds.clear();
                isFirstLoad = false;
                return;
            }
            noMsg.style.display = 'none';

            // 💡 判斷是否為新進訂單
            let hasNewOrder = false;
            orders.forEach(o => {
                if (!knownOrderIds.has(o.id)) {
                    if (!isFirstLoad) {
                        hasNewOrder = true;
                    }
                    knownOrderIds.add(o.id);
                }
            });

            if (hasNewOrder) {
                playChime();
            }
            isFirstLoad = false;

            const currentTimestamp = Date.now() / 1000;

            grid.innerHTML = orders.map(o => {
                const waitMinutes = Math.floor((currentTimestamp - o.timestamp) / 60);
                
                let borderClass = 'border-time-normal';
                let timeBadgeClass = 'bg-success';
                if (waitMinutes >= 10) {
                    borderClass = 'border-time-danger';
                    timeBadgeClass = 'bg-danger';
                } else if (waitMinutes >= 5) {
                    borderClass = 'border-time-warning';
                    timeBadgeClass = 'bg-warning text-dark';
                }

                return `
                <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                    <div class="kds-card p-3 h-100 shadow-lg ${borderClass}">
                        <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom border-secondary">
                            <div>
                                <h3 class="fw-bold text-warning mb-0">#${o.id}</h3>
                                <small class="text-white-50"><i class="bi bi-person me-1"></i>${o.table_number}</small>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-primary mb-1">${o.order_type}</span><br>
                                <span class="badge ${timeBadgeClass}">
                                    <i class="bi bi-clock me-1"></i>已等 ${waitMinutes} 分鐘
                                </span>
                            </div>
                        </div>

                        ${o.order_type === '外帶' ? `
                        <div class="mb-2">
                            <span class="badge ${o.need_cutlery ? 'bg-success' : 'bg-secondary'} small">
                                ${o.need_cutlery ? '要餐具' : '不用餐具'}
                            </span>
                            ${o.note ? `<div class="small text-warning mt-1">備註：${o.note}</div>` : ''}
                        </div>` : ''}

                        <div class="flex-grow-1 my-2 overflow-y-auto" style="max-height: 260px;">
                            ${o.items.map(item => `
                                <div class="item-row py-2">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="fs-5 fw-bold text-white">${item.name}</span>
                                        <span class="badge bg-light text-dark fs-6 px-2">x ${item.quantity}</span>
                                    </div>
                                    ${item.customization ? `
                                        <div class="text-danger fw-bold small mt-1">
                                            <i class="bi bi-arrow-return-right me-1"></i>${item.customization}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>

                        <div class="pt-2 mt-auto">
                            <button class="btn btn-complete w-100 shadow" onclick="completeOrder(${o.id})">
                                <i class="bi bi-check-circle-fill me-1"></i> 完成出餐
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function completeOrder(orderId) {
            getAudioContext();
            fetch(`/api/kitchen_update_status/${orderId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'Completed' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    knownOrderIds.delete(orderId);
                    fetchKitchenOrders();
                } else {
                    alert(data.message || '操作失敗');
                }
            })
            .catch(err => alert('連線失敗'));
        }

    // ==============================================================================
    // 新增：廚房看板 SSE 即時推播監聽器
    // ==============================================================================
        let kitchenEventSource = null;
        let kitchenLastPendingCount = null;

        function initKitchenSSE() {
            if (!window.EventSource) {
                console.warn("瀏覽器不支援 SSE，改用輪詢模式。");
                setInterval(fetchKitchenOrders, 3000);
                return;
            }

            kitchenEventSource = new EventSource('/api/orders_stream');

            kitchenEventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    // 待製作筆數變更時即時呼叫 fetchKitchenOrders 更新畫面與觸發叮咚聲
                    if (kitchenLastPendingCount === null || kitchenLastPendingCount !== data.pending_count) {
                        kitchenLastPendingCount = data.pending_count;
                        fetchKitchenOrders();
                    }
                } catch (e) {
                    console.error("解析 SSE 資料錯誤:", e);
                }
            };

            kitchenEventSource.onerror = function(err) {
                console.warn("廚房 SSE 連線異常，已啟動自動輪詢備援...", err);
                if (!window.kitchenPollingFallback) {
                    window.kitchenPollingFallback = setInterval(fetchKitchenOrders, 3000);
                }
            };

            kitchenEventSource.onopen = function() {
                if (window.kitchenPollingFallback) {
                    clearInterval(window.kitchenPollingFallback);
                    window.kitchenPollingFallback = null;
                }
            };
        }

        // 網頁載入後初次抓取一次並建立 SSE 連線
        fetchKitchenOrders();
        initKitchenSSE();

        //  一鍵全部完成出餐邏輯
        function completeAllOrders() {
            getAudioContext();
            const count = knownOrderIds.size;
            if (count === 0) {
                alert('目前沒有待製作的訂單！');
                return;
            }

            if (!confirm(`⚠️ 確定要將目前畫面上共 ${count} 筆待製作訂單【全部標記為已出餐】嗎？`)) {
                return;
            }

            const btn = document.getElementById('completeAllBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 處理中...';

            fetch('/api/kitchen_complete_all', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    knownOrderIds.clear();
                    fetchKitchenOrders();
                } else {
                    alert(data.message || '操作失敗');
                }
            })
            .catch(err => {
                console.error(err);
                alert('連線失敗，請稍後再試！');
            })
            .finally(() => {
                btn.innerHTML = '<i class="bi bi-check-all fs-6 me-1"></i> 全部完成';
            });
        }
    </script>
</body>
</html>
