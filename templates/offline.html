{% extends "base.html" %}
{% block title %}{{ ui.off_page_title }}{% endblock %}
{% block content %}
<main class="container py-5 text-center" id="offline-page">
    <i class="bi bi-wifi-off display-1 text-warning"></i>
    <h1 class="h4 fw-bold mt-3">{{ ui.off_title }}</h1>
    <p class="text-white-50">{{ ui.off_text }}</p>
    <a class="btn btn-warning fw-bold text-dark" href="{{ url_for('customer.customer_index') }}">{{ ui.reload }}</a>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/kiosk-offline.js') }}"></script>{% endblock %}
