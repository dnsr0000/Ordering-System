<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取餐叫號即時看板 - 自助點餐系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: "Microsoft JhengHei", -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header-counter {
            background: #151e32;
            border-bottom: 2px solid #334155;
        }
        .number-card {
            background: #1e293b;
            border-radius: 20px;
            border: 4px solid #22c55e;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.2);
            transition: transform 0.2s ease;
            container-type: inline-size; 
            overflow: hidden;
        }
        .order-number-display {
            font-size: clamp(2rem, 18cqw, 4.5rem);
            font-weight: 900;
            color: #22c55e;
            letter-spacing: 1px;
            white-space: nowrap;
            line-height: 1.1;
        }
        .preparing-box {
            background: #1a2234;
            border: 2px solid #475569;
            border-radius: 16px;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header class="header-counter py-3 px-4 mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <i class="bi bi-display text-warning display-6"></i>
                <div>
                    <h3 class="mb-0 fw-bold text-white">櫃檯取餐叫號即時看板</h3>
                    <small class="text-white-50">請依叫號燈號與語音提示至櫃檯取餐</small>
                </div>
            </div>

            <div class="d-flex align-items-center gap-3">
                <button id="speechToggleBtn" class="btn btn-outline-warning btn-sm fw-bold px-3 py-2" onclick="toggleSpeech()">
                    <i class="bi bi-volume-up-fill me-1"></i> 語音叫號：<span id="speechStatusText">已開啟</span>
                </button>
                <div class="bg-dark px-4 py-2 rounded border border-secondary text-warning fw-bold fs-5" style="font-family: monospace;" id="counter-clock">
                    00:00:00
                </div>
                <a href="/" target="_blank" class="btn btn-outline-light btn-sm fw-bold px-3 py-2">
                    <i class="bi bi-shop me-1"></i> 點餐前台
                </a>
            </div>
        </div>
    </header>

    <!-- 主要叫號區塊 -->
    <div class="container-fluid px-4">
        <div class="row g-4">
            
            <!-- 左側：已完成 / 叫號中 (大字體區塊) -->
            <div class="col-lg-8">
                <div class="p-4 rounded-3 mb-3" style="background: #151e32; border: 1px solid #334155;">
                    <div class="d-flex align-items-center gap-2 mb-4 border-bottom border-secondary pb-2">
                        <i class="bi bi-megaphone-fill text-success fs-3"></i>
                        <h4 class="fw-bold text-success mb-0">請取餐 (Ready for Pickup)</h4>
                    </div>

                    <div id="readyOrdersGrid" class="row g-3">
                        <!-- 動態插入已出餐號碼 -->
                    </div>

                    <div id="noReadyMessage" class="text-center py-5" style="display: none;">
                        <i class="bi bi-cup-hot text-secondary display-1"></i>
                        <h4 class="text-white-50 mt-3">目前尚無等待取餐號碼</h4>
                    </div>
                </div>
            </div>

            <!-- 右側：製作中看板摘要 -->
            <div class="col-lg-4">
                <div class="preparing-box p-4 h-100">
                    <div class="d-flex align-items-center gap-2 mb-3 border-bottom border-secondary pb-2">
                        <i class="bi bi-fire text-warning fs-4"></i>
                        <h5 class="fw-bold text-warning mb-0">製作中看板 (Preparing)</h5>
                    </div>
                    <div id="preparingList" class="d-flex flex-column gap-2 overflow-y-auto" style="max-height: 65vh;">
                        <!-- 動態插入製作中清單 -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let isSpeechEnabled = true;
        let lastReadyOrderIds = new Set();
        let isFirstLoad = true;
        let counterEventSource = null;
        let lastPendingCount = null;
        let lastReadySignature = '';
        let lastPreparingSignature = '';

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('counter-clock');
            if (clockEl) clockEl.innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleSpeech() {
            isSpeechEnabled = !isSpeechEnabled;
            const statusText = document.getElementById('speechStatusText');
            const btn = document.getElementById('speechToggleBtn');
            if (statusText) statusText.innerText = isSpeechEnabled ? '已開啟' : '已靜音';
            if (btn) btn.className = isSpeechEnabled ? 'btn btn-outline-warning btn-sm fw-bold px-3 py-2' : 'btn btn-outline-secondary btn-sm fw-bold px-3 py-2';
            
            if (isSpeechEnabled) {
                speakOrderNumber("系統語音叫號已開啟");
            }
        }

        function speakOrderNumber(text) {
            if (!isSpeechEnabled || !window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn("語音播放失敗:", e);
            }
        }

        function fetchCounterData() {
            fetch('/api/admin_live_orders')
                .then(res => res.json())
                .then(data => {
                    if (!data.success || !data.orders) return;

                    const readyOrders = data.orders.filter(o => o.status === 'Completed');
                    const preparingOrders = data.orders.filter(o => o.status === 'Pending');

                    renderReadyOrders(readyOrders);
                    renderPreparingOrders(preparingOrders);
                })
                .catch(err => console.error("櫃檯看板同步失敗:", err));
        }

        function renderReadyOrders(orders) {
            const grid = document.getElementById('readyOrdersGrid');
            const noMsg = document.getElementById('noReadyMessage');
            if (!grid || !noMsg) return;

            // 髒檢查簽章：若訂單清單未變動，直接跳過重繪以防止閃爍
            const currentSignature = orders.map(o => o.id).join(',');
            if (currentSignature === lastReadySignature && !isFirstLoad) {
                return;
            }
            lastReadySignature = currentSignature;

            if (orders.length === 0) {
                grid.innerHTML = '';
                noMsg.style.display = 'block';
                lastReadyOrderIds.clear();
                isFirstLoad = false;
                return;
            }
            noMsg.style.display = 'none';

        let newReadyIds = new Set();
        let newlyCompletedPickupNumbers = [];

        orders.forEach(o => {
            newReadyIds.add(o.id);
            if (!lastReadyOrderIds.has(o.id) && !isFirstLoad) {
                const pNum = String(o.pickup_number || o.id).padStart(3, '0');
                newlyCompletedPickupNumbers.push(`${pNum} 號`);
            }
        });

        // 若有新出餐的號碼，批次產生語音
        if (newlyCompletedPickupNumbers.length > 0) {
            if (newlyCompletedPickupNumbers.length === 1) {
                speakOrderNumber(`請，取餐號碼 ${newlyCompletedPickupNumbers[0]}，至櫃檯取餐`);
            } else {
                // 多筆訂單同時完成時合併播報，避免互相覆蓋
                const numbersText = newlyCompletedPickupNumbers.join('、');
                speakOrderNumber(`請，取餐號碼 ${numbersText}，至櫃檯取餐`);
            }
        }

        lastReadyOrderIds = newReadyIds;
        isFirstLoad = false;

            grid.innerHTML = orders.map(o => `
                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="number-card p-4 text-center">
                        <div class="text-white-50 small mb-1">取餐編號</div>
                        <div class="order-number-display">#${String(o.pickup_number || o.id).padStart(3, '0')}</div>
                        <small class="text-white-50 d-block">系統單號 #${o.id}</small>
                        <div class="badge bg-success text-dark fw-bold mt-2 px-3 py-1">
                            ${o.order_type} (${o.user_name})
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderPreparingOrders(orders) {
            const list = document.getElementById('preparingList');
            if (!list) return;

            // 髒檢查簽章：若製作中清單未變動，直接跳過重繪
            const currentSignature = orders.map(o => o.id).join(',');
            if (currentSignature === lastPreparingSignature) {
                return;
            }
            lastPreparingSignature = currentSignature;

            if (orders.length === 0) {
                list.innerHTML = '<div class="text-white-50 text-center py-4 small">目前沒有製作中的訂單</div>';
                return;
            }

            list.innerHTML = orders.map(o => `
                <div class="p-3 rounded bg-dark border border-secondary d-flex justify-content-between align-items-center">
                    <div>
                        <span class="fw-bold text-warning fs-5 me-2">取餐 #${String(o.pickup_number || o.id).padStart(3, '0')}</span>
                        <small class="text-white-50 me-2">(單號 #${o.id})</small>
                        <span class="badge bg-primary">${o.order_type}</span>
                    </div>
                    <div class="text-white-50 small">
                        <i class="bi bi-clock me-1"></i>${o.created_at}
                    </div>
                </div>
            `).join('');
        }

        // 依據 pending_count 變化才觸發重新拉取資料
        let counterLastSignature = null;

        function initCounterSSE() {
            if (!window.EventSource) {
                console.warn("瀏覽器不支援 SSE，改用定時檢查。");
                window.counterPollingFallback = setInterval(fetchCounterData, 5000);
                return;
            }

            counterEventSource = new EventSource('/api/orders_stream');

            counterEventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    // 只要任何訂單狀態產生改變（如出餐、取餐），簽章變動即時重抓資料
                    if (counterLastSignature === null || counterLastSignature !== data.state_signature) {
                        counterLastSignature = data.state_signature;
                        fetchCounterData();
                    }
                } catch (e) {
                    console.error("解析 SSE 資料失敗:", e);
                }
            };

            counterEventSource.onerror = function(err) {
                if (!window.counterPollingFallback) {
                    window.counterPollingFallback = setInterval(fetchCounterData, 5000);
                }
            };

            counterEventSource.onopen = function() {
                if (window.counterPollingFallback) {
                    clearInterval(window.counterPollingFallback);
                    window.counterPollingFallback = null;
                }
            };
        }

        fetchCounterData();
        initCounterSSE();
    </script>
</body>
</html>
