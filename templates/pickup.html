{% extends "base.html" %}

{% block title %}櫃檯人員取餐核銷介面{% endblock %}

{% block head %}
{# 沒有網站圖示：避免瀏覽器請求 /favicon.ico 得到 404 (建議移到 base.html) #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pickup.css') }}">
{% endblock %}

{% block content %}
<header class="header-pickup py-3 px-4 mb-4 sticky-top">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-person-check-fill text-success fs-2"></i>
            <div>
                <h4 class="mb-0 fw-bold text-white">櫃檯取餐核銷系統</h4>
                <small class="text-white-50">待取餐訂單：<span id="readyCountBadge" class="badge bg-success fs-6">0</span> 筆</small>
            </div>
        </div>

        <div class="d-flex align-items-center gap-3">
            <form id="quickPickupForm" class="input-group input-group-sm quick-pickup" autocomplete="off">
                <span class="input-group-text bg-dark border-secondary text-white"><i class="bi bi-search"></i></span>
                <input type="text" id="quickSearchInput" class="form-control bg-dark text-white border-secondary"
                       inputmode="numeric" placeholder="輸入號碼快速核銷..." aria-label="取餐號碼">
                <button type="submit" class="btn btn-warning fw-bold">核銷</button>
            </form>
            <a href="{{ url_for('pickup.counter_display') }}" target="_blank" rel="noopener" class="btn btn-outline-info btn-sm fw-bold text-nowrap">
                <i class="bi bi-display me-1"></i> 開啟叫號大螢幕
            </a>
        </div>
    </div>
</header>

<main class="container-fluid px-4 pb-4">
    <div id="pickupCardsGrid" class="row g-3" aria-live="polite"></div>

    <div id="noOrdersMessage" class="text-center py-5 d-none">
        <i class="bi bi-check2-circle text-success display-1"></i>
        <h3 class="text-white-50 mt-3">目前所有餐點皆已取餐完畢！</h3>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pickup.js') }}"></script>
{% endblock %}
