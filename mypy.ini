# 型別檢查 (CI 的 lint 工作與本機 `mypy`)：先只檢查 app/services (已加型別註記的函式才檢查內容)，之後逐步擴大。
[mypy]
python_version = 3.13
files = app/services
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_ignores = True
no_implicit_optional = False
show_error_codes = True

# 新模組完整檢查 (未註記函式的內容也檢查)；舊模組逐步補註記後加入
[mypy-app.services.offsite_backup_service,app.services.update_service,app.services.observability,app.services.receipt_service,app.services.i18n_pages,app.services.intake_service,app.services.eta_service,app.services.reorder_service,app.services.push_service,app.services.log_service,app.services.static_version,app.services.http_client]
check_untyped_defs = True
