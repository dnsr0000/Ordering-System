# 自動測試：push 到 main / 開 Pull Request 時執行。失敗時 PR 會顯示紅色叉叉，請修正後再合併。
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 靜態檢查 (ruff) 與依賴漏洞稽核 (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      # mypy 需要專案的相依套件才能看到正確的型別 (與本機結果一致)
      - run: pip install -r requirements-dev.txt ruff pip-audit mypy
      # 未定義名稱 / 未使用匯入 / 語法錯誤 (規則在 ruff.toml)：有問題就失敗
      - run: ruff check .
      # 型別檢查 (mypy.ini：目前只檢查 app/services 有型別註記的函式)
      - run: mypy
      # 已知漏洞的套件版本：只提出警告 (不擋合併)，請依報告升級 requirements.txt 的版本
      - run: pip-audit -r requirements.txt -r requirements-store.txt -r requirements-dev.txt --desc on
        continue-on-error: true

  unit:
    name: pytest (SQLite, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # 前端共用純邏輯 (static/js/shared/) 的測試以 node 執行 (tests/test_shared_js_logic.py)
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      # 3.13 另外計算涵蓋率 (app/ 的行數涵蓋率低於門檻就失敗；報告在工作摘要)
      - run: pytest -q
        if: matrix.python != '3.13'
      - run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85 | tee coverage.txt
        if: matrix.python == '3.13'
      - run: |
          { echo '### 測試涵蓋率 (app/)'; echo '```'; tail -n 25 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        if: matrix.python == '3.13' && always()

  postgres:
    name: pytest (PostgreSQL，線上端)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kiosk
          POSTGRES_PASSWORD: kiosk
          POSTGRES_DB: kiosk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kiosk" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kiosk:kiosk@127.0.0.1:5432/kiosk_test
      TEST_SYNC_HUB_DATABASE_URL: postgresql://kiosk:kiosk@127.0.0.1:5432/kiosk_sync_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: PGPASSWORD=kiosk psql -h 127.0.0.1 -U kiosk -d kiosk_test -c "CREATE DATABASE kiosk_sync_test"
      - run: pytest -q

  e2e:
    name: 瀏覽器端對端測試
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m e2e
