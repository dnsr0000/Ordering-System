# 靜態檢查 (CI 的 lint 工作與本機 `ruff check .`)：先只開「一定是錯」的規則 (未定義名稱、未使用匯入、語法錯誤)，
# 風格規則 (E / W) 另外用 --select 手動檢查，不擋 CI。
line-length = 130
target-version = "py313"
extend-exclude = ["repomix-output.xml", ".venv", "database", "uploads", "models"]

[lint]
select = ["F", "E9"]

[lint.per-file-ignores]
# 測試檔以 import 共用其他測試檔的 fixture (pytest 以名稱注入)，對 pyflakes 來說像是「重新定義」
"tests/*" = ["F811"]
# 套件入口的 re-export
"app/services/order_service.py" = ["F401"]
"app/__init__.py" = ["F401"]
